name: One-time four-platform accession
on:
  push:
    paths:
      - '.github/workflows/expand-platforms.yml'
permissions:
  contents: write
jobs:
  accession:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preserve and build pinned multi-platform metadata
