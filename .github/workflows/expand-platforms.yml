          platform_add = [
            {
              "id": "n64",
              "name": "Nintendo 64",
              "manufacturer": "Nintendo",
              "kind": "home"
            },
            {
              "id": "genesis",
              "name": "Sega Mega Drive / Genesis",
              "manufacturer": "Sega",
              "kind": "home"
            },
            {
              "id": "sms",
              "name": "Sega Master System / Mark III",
              "manufacturer": "Sega",
              "kind": "home"
            },
            {
              "id": "gg",
              "name": "Sega Game Gear",
              "manufacturer": "Sega",
              "kind": "handheld"
            }
          ]
          base_path=Path("sources/libretro-no-intro.json")
          extra_path=Path("sources/libretro-enrichment.json")
          platform_path=Path("platforms/platforms.json")
          base=json.loads(base_path.read_text())
          extra=json.loads(extra_path.read_text())
          platforms=json.loads(platform_path.read_text())
          assert base["repository_revision"]==extra["repository_revision"]==rev
          assert not ({x["platform"] for x in base_add} & {x["platform"] for x in base["files"]})
          assert not ({(x["platform"],x["field"]) for x in field_add} & {(x["platform"],x["field"]) for x in extra["files"]})
          assert not ({x["id"] for x in platform_add} & {x["id"] for x in platforms["platforms"]})
          base["files"].extend(base_add)
          extra["files"].extend(field_add)
          platforms["platforms"].extend(platform_add)
          for path,thing in [(base_path,base),(extra_path,extra),(platform_path,platforms)]:
              path.write_text(json.dumps(thing,indent=2,ensure_ascii=False)+"\n")
          print(f"Registered {len(base_add)} identification and {len(field_add)} bibliographic sources")
          PY
          python3 tools/fetch_pinned_sources.py
          python3 tools/rebuild_catalog.py --write
          python3 tools/import_enrichment.py --write
          python3 tools/audit_catalog.py --write
          python3 tools/audit_enrichment.py --write
          python3 tools/triage_enrichment.py --write
          python3 tools/build_distribution.py --write
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          base=json.loads(Path("generated/v1/catalog.json").read_text())
          claim=json.loads(Path("reports/enrichment-coverage-v1.json").read_text())
          source=json.loads(Path("sources/libretro-enrichment.json").read_text())
          counts={x["platform"]:x["source_records"] for x in base["platforms"]}
          total=sum(counts.values())
          matched=claim["resolution_counts"]["matched"]
          readme=Path("README.md")
          old=readme.read_text()
          add="".join(f"| {label} | {counts[id]:,} |\n" for id,label in [
          ("n64","Nintendo 64"),("genesis","Sega Mega Drive / Genesis"),("sms","Sega Master System"),("gg","Sega Game Gear")])
          updated=re.sub(r"(\| \*\*Total\*\* \| \*\*[\d,]+\*\* \|)",add+f"| **Total** | **{total:,}** |",old)
          updated=updated.replace("The current source accession spans six Nintendo platforms:","The current accession spans ten console and handheld platforms:")
          updated=re.sub(r"\d+ pinned Libretro DATs supply \*\*[\d,]+ bibliographic claims\*\*",
              f"{len(source['files'])} pinned Libretro DATs supply **{claim['total_claims']:,} bibliographic claims**",updated)
          updated=re.sub(r"attaches \*\*[\d,]+ claims\*\*", f"attaches **{matched:,} claims**",updated)
          updated=updated.replace("thirteen consumer artifacts",f"{len(base['platforms'])*2+1} consumer artifacts")
          assert updated!=old and f"**{total:,}**" in updated and f"**{matched:,} claims**" in updated
          readme.write_text(updated)
          from pathlib import Path
          for name, before, after in [
          ("docs/ROADMAP.md", "six platforms", "ten platforms"),
          ("docs/SOURCE-STRATEGY.md","six Nintendo platforms","ten Nintendo and Sega platforms"),
          ("docs/SOURCE-STRATEGY.md","six identification DATs and 53 bibliographic DATs",f"ten identification DATs and {len(source['files'])} bibliographic DATs"),
          ("sources/README.md","six pinned SNES, Game Boy, Game Boy Color, Game Boy Advance, NES, and Nintendo DS source files","ten pinned Nintendo and Sega platform identification source files"),
          ("reports/README.md","six-platform SNES, Game Boy, Game Boy Color, Game Boy Advance, NES, and Nintendo DS source collections","ten-platform Nintendo and Sega source collections"),
          ]:
              path=Path(name)
              value=path.read_text()
              if before in value:path.write_text(value.replace(before,after))
          print(f"Docs updated: {len(counts)} platforms, {total:,} records, {claim['total_claims']:,} claims")
          PY
          python3 -m unittest discover -s tests -v
          python3 tools/rebuild_catalog.py --check
          python3 tools/import_enrichment.py --check
          python3 tools/audit_enrichment.py --check
          python3 tools/triage_enrichment.py --check
          python3 tools/build_distribution.py --check
          python3 tools/check_docs.py
          python3 tools/package_runtime.py --build /tmp/ludographium-runtime-expanded.tar.gz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/ archive/ generated/ reports/ platforms/ README.md docs/
          git diff --cached --quiet && { echo 'No new source data'; exit 0; }
          git commit -m 'data: accession N64, Genesis, Master System, and Game Gear metadata'
          git push origin HEAD:main
