name: Validate disposable MAME source-evidence SQLite reader

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-mame-sqlite-v1.yml
      - tools/build_mame_catalog_sqlite.py

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build full local-only index from CC0 original text evidence
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          database="$temp/ludographium-mame.sqlite"
          python tools/build_mame_catalog_sqlite.py --db "$database" --build > "$temp/built.json"
          python tools/build_mame_catalog_sqlite.py --db "$database" --verify > "$temp/verified.json"
          python tools/build_mame_catalog_sqlite.py --db "$database" --summary > "$temp/summary.json"
          python - "$temp/summary.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf-8") as source:
              value=json.load(source)
          assert value["source_lists"] == 69
          assert value["software"] == 33119
          assert value["libretro_sources"] == 75
          assert value["libretro_records"] == 117145
          assert value["libretro_media"] == 117145
          assert value["exact_media_links"] == 19152
          assert value["rejected_size_conflicts"] == 1
          assert value["title_review_candidates"] == 6833
          assert value["provenance"] == 97
          assert value["source_review_units"] == 21845
          assert value["source_review_targets"] >= 21845
          assert value["media_claims"] > 38000
          assert value["rejected_size_conflicts"] == 1
          print("Verified comprehensive 69-list local source-evidence reader:",value)
          import sqlite3
          db_path=sys.argv[1].replace("summary.json","ludographium-mame.sqlite")
          with sqlite3.connect(db_path) as db:
              assert db.execute("SELECT count(*) FROM title_review_candidates").fetchone()[0] == 6833
              assert db.execute("SELECT count(*) FROM source_review_units").fetchone()[0] == 21845
              assert db.execute("SELECT count(*) FROM source_review_units WHERE ambiguous=1").fetchone()[0] == 2044
              assert db.execute("SELECT count(*) FROM source_lists WHERE cohort='v3'").fetchone()[0] == 4
              assert db.execute("SELECT count(*) FROM software s JOIN source_lists l USING(source_list) WHERE l.cohort='v3'").fetchone()[0] == 166
              assert db.execute("SELECT count(*) FROM exact_media_links WHERE source_ordinal>19025").fetchone()[0] == 127
              assert db.execute("SELECT count(*) FROM title_review_candidates WHERE source_ordinal>6825").fetchone()[0] == 8
              assert db.execute("SELECT count(*) FROM source_review_units r JOIN source_lists l ON r.mame_list=l.source_list WHERE l.cohort='v3'").fetchone()[0] == 133
              assert db.execute("""SELECT count(*) FROM title_review_candidates t
                JOIN exact_media_links l ON t.mame_list=l.mame_list
                AND t.mame_software_ordinal=l.mame_software_ordinal""").fetchone()[0] == 0
          PY
          python tools/build_mame_catalog_sqlite.py --db "$database" --query --list gamecom --title Batman --limit 2 > "$temp/gamecom.json"
          python tools/build_mame_catalog_sqlite.py --db "$database" --query --list a5200 --linked-only --limit 2 > "$temp/a5200.json"
          python tools/build_mame_catalog_sqlite.py --db "$database" --query-review --list a5200 --limit 2 > "$temp/a5200-review.json"
          python tools/build_mame_catalog_sqlite.py --db "$database" --query --list psx --without-review-leads --limit 2 > "$temp/unlinked.json"
          python tools/build_mame_catalog_sqlite.py --db "$database" --query --list wswan --linked-only --limit 2 > "$temp/wswan.json"
          python tools/build_mame_catalog_sqlite.py --db "$database" --query --libretro-platform tigergamecom --limit 3 > "$temp/links.json"
          python tools/build_mame_catalog_sqlite.py --db "$database" --query-libretro --platform tigergamecom --linked-only --limit 3 > "$temp/libretro.json"
          python tools/build_mame_catalog_sqlite.py --db "$database" --query-libretro --platform gb --title Pokemon --limit 2 > "$temp/gameboy.json"
          python tools/build_mame_catalog_sqlite.py --db "$database" --query-libretro --platform n64 --without-review-leads --limit 2 > "$temp/libretro-gaps.json"
          python tools/build_mame_catalog_sqlite.py --db "$database" --query-all --title Tetris --limit 2 > "$temp/both.json"
          if python tools/build_mame_catalog_sqlite.py --db "$database" --query-all --list gamecom --title Tetris --limit 2 > "$temp/invalid-joint-query.log" 2>&1; then
            echo "Joint source search silently ignored provider-specific constraints" >&2
            exit 1
          fi
          python tools/build_mame_catalog_sqlite.py --db "$database" --query-review --evidence-type title --ambiguous-only --limit 2 > "$temp/review.json"
          python tools/build_mame_catalog_sqlite.py --db "$database" --query-review --platform tigergamecom --limit 2 > "$temp/gamecom-review.json"
          python - "$temp/a5200.json" "$temp/a5200-review.json" "$temp/gamecom.json" "$temp/wswan.json" "$temp/links.json" "$temp/libretro.json" "$temp/gameboy.json" "$temp/review.json" "$temp/gamecom-review.json" "$temp/unlinked.json" "$temp/libretro-gaps.json" "$temp/both.json" <<'PY'
          import json,sys
          additional=[json.load(open(name,encoding="utf-8")) for name in sys.argv[1:3]]
          assert additional[0]["source_software_entries"] == 33119
          assert additional[0]["total_filtered_source_observations"] > 0
          assert additional[0]["records"][0]["original_source_observation"]["source_list"] == "a5200"
          assert additional[1]["total_pinned_source_review_units"] == 21845
          assert additional[1]["total_filtered_review_units"] > 0
          assert all(item["mame"]["source_cohort"] == "v3" for item in additional[1]["units"])
          results=[json.load(open(name,encoding="utf-8")) for name in sys.argv[3:]]
          assert all(item["total_filtered_source_observations"] > 0 for item in results[:5])
          assert all(item["returned_source_observations"] > 0 for item in results[:5])
          assert all(item["total_filtered_review_units"] > 0 for item in results[5:7])
          assert all(item["returned_review_units"] > 0 for item in results[5:7])
          assert results[7]["total_filtered_source_observations"] > 0
          assert results[7]["returned_source_observations"] > 0
          assert all(item["interpretation"].find("not-canonical") >= 0 for item in results[:5])
          assert "no canonical" in results[5]["interpretation"]
          assert "no canonical" in results[6]["interpretation"]
          assert results[3]["independent_libretro_source_collections"] == 75
          assert results[3]["original_libretro_source_records"] == 117145
          assert all(item["source_license"] == "CC-BY-SA-4.0" for item in results[3]["records"])
          assert results[5]["total_pinned_source_review_units"] == 21845
          assert all(unit["multiple_source_target_alternatives"] for unit in results[5]["units"])
          assert all(unit["title_evidence_jsonl_source_ordinals"] for unit in results[5]["units"])
          assert all(unit["stable_review_id"].startswith("lgreview:v1:") for unit in results[6]["units"])
          assert results[7]["total_filtered_source_observations"] == 2915
          assert results[7]["without_any_cross_provider_review_lead"]
          assert all(not x["exact_media_evidence_links"] and
                     not x["separate_unverified_title_review_leads"]
                     for x in results[7]["records"])
          assert results[8]["total_filtered_source_observations"] > 0
          assert results[8]["returned_source_observations"] > 0
          assert results[8]["without_any_cross_provider_review_lead"]
          assert all(not item["review_only_mame_media_links"]
                     and not item["separate_unverified_title_review_leads"]
                     for item in results[8]["records"])
          assert all(item["source_platform"] == "n64" for item in results[8]["records"])
          assert results[9]["source_mode"] == "separate-original-MAME-and-Libretro-provider-lookups"
          assert results[9]["mame"]["total_filtered_source_observations"] > 0
          assert results[9]["libretro"]["total_filtered_source_observations"] > 0
          assert "no-cross-source" in results[9]["matching_policy"]
          print("Verified ten source-scoped search modes with pinned independent licenses")
          PY
          cat > "$temp/queries.jsonl" <<'JSONL'
          {"id":"tetris","title":"Tetris","limit":2}
          {"id":"mario","title":"Mario","limit":2}
          JSONL
          python tools/batch_query_game_sources.py --db "$database" --input "$temp/queries.jsonl" > "$temp/batch-results.jsonl"
          python - "$temp/batch-results.jsonl" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf-8") as source:
              results=[json.loads(line) for line in source]
          assert [row["request_id"] for row in results] == ["tetris","mario"]
          assert all(row["response"]["mame"]["total_filtered_source_observations"] > 0 for row in results)
          assert all(row["response"]["libretro"]["total_filtered_source_observations"] > 0 for row in results)
          assert all(row["response"]["matching_policy"] == "no-cross-source-work-or-release-identity-merge" for row in results)
          print("Verified two bounded batch searches using one pinned source database")
          PY
      - name: Confirm no binary database is committed or published
        shell: bash
        run: |
          if git ls-files | grep -Ei '\.(sqlite|sqlite3|db|mdb)$'; then
            echo "Derived SQLite must not be committed"
            exit 1
          fi
          echo "Original text sources only; no SQLite uploaded"
