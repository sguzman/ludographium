name: Audit Wikidata game authority identifier collisions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/review-authority-ids.yml

permissions:
  contents: write

concurrency:
  group: wikidata-game-authority-review-main
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Audit every original property-qualified authority ID claim
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          jq -c '{
            property: (.property.value | split("/")[-1]),
            identifier: .value.value,
            rdf_kind: .value.type,
            item_qid: (.item.value | split("/")[-1]),
            platform: (input_filename | split("/")[-2]),
            source_path: input_filename
          }' data/wikidata/authority-ids-v1/*/bindings.jsonl \
            > "$RUNNER_TEMP/authority-claims.jsonl"
          test "$(wc -l < "$RUNNER_TEMP/authority-claims.jsonl")" -eq 65182
          jq -s --arg source_commit "$GITHUB_SHA" '
            . as $claims
            | ($claims | group_by([.property,.identifier])) as $identifiers
            | ($identifiers | map(select((map(.item_qid) | unique | length) > 1))) as $ambiguous
            | ($identifiers | map(select((map(.platform) | unique | length) > 1))) as $crossplatform
            | {
                schema_version: 1,
                kind: "pinned-wikidata-third-party-game-authority-id-review",
                source_commit_sha: $source_commit,
                source: "Original pinned Wikidata CC0 authority-id source query responses across 16 declared platforms",
                source_claims: ($claims | length),
                distinct_property_scoped_identifier_strings: ($identifiers | length),
                identifiers_observed_on_multiple_platforms: ($crossplatform | length),
                identifier_values_attached_to_multiple_game_qids: ($ambiguous | length),
                provider_counts: (
                  $claims | group_by(.property)
                  | map({
                    key: .[0].property,
                    value: {
                      claims: length,
                      distinct_identifier_strings: (map(.identifier) | unique | length),
                      distinct_game_qids: (map(.item_qid) | unique | length)
                    }
                  }) | from_entries
                ),
                game_qids_with_both_mobygames_identifier_schemes: (
                  $claims | group_by(.item_qid)
                  | map(select(
                    (map(.property) | index("P11688")) != null
                    and (map(.property) | index("P1933")) != null
                  ))
                  | length
                ),
                multi_qid_examples_first_30: (
                  $ambiguous[:30] | map({
                    property: .[0].property,
                    identifier: .[0].identifier,
                    distinct_qids: (map(.item_qid) | unique),
                    platforms: (map(.platform) | unique),
                    original_source_paths: (map(.source_path) | unique)
                  })
                ),
                interpretation: "Independent Wikidata property-qualified identifier assertions only. Repetition across platforms is not a duplicate error, matching source identifiers do not verify an external provider entry, and this is not a ground-truth false-positive evaluation."
              }
          ' "$RUNNER_TEMP/authority-claims.jsonl" \
            > reports/wikidata-authority-identifier-review-v1.json
          jq -e '
            .source_claims == 65182
            and .provider_counts.P11688.claims == 16800
            and .provider_counts.P1933.claims == 15725
            and .provider_counts.P4769.claims == 23606
            and .distinct_property_scoped_identifier_strings > 0
          ' reports/wikidata-authority-identifier-review-v1.json > /dev/null
          jq -c '{
            source_claims,
            distinct_property_scoped_identifier_strings,
            identifiers_observed_on_multiple_platforms,
            identifier_values_attached_to_multiple_game_qids,
            game_qids_with_both_mobygames_identifier_schemes
          }' reports/wikidata-authority-identifier-review-v1.json
      - name: Commit report without changing pinned source evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git add reports/wikidata-authority-identifier-review-v1.json
          if git diff --cached --quiet; then
            echo "Report already present"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'reports: quantify independently sourced game authority ID ambiguity'
          git push origin HEAD:main
