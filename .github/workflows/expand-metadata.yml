name: One-time additional Libretro metadata
on:
  push:
    paths:
      - '.github/workflows/expand-metadata.yml'
permissions:
  contents: write
jobs:
  accession:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preserve and index pinned metadata sources
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          
          additions = [
            {
              "platform": "nes",
              "field": "franchise",
              "source_path": "metadat/franchise/Nintendo - Nintendo Entertainment System.dat",
              "git_blob_sha": "a7ccbb6926be44b9e50c57e8ea274d80e5580ed7"
            },
            {
              "platform": "snes",
              "field": "franchise",
              "source_path": "metadat/franchise/Nintendo - Super Nintendo Entertainment System.dat",
              "git_blob_sha": "adb6d50f7a570897bbc85f0ce81d172d0f37c1f5"
            },
            {
              "platform": "gb",
              "field": "franchise",
              "source_path": "metadat/franchise/Nintendo - Game Boy.dat",
              "git_blob_sha": "9534074320d90543c5f75a36e535a6b7c7c31e23"
            },
            {
              "platform": "gbc",
              "field": "franchise",
              "source_path": "metadat/franchise/Nintendo - Game Boy Color.dat",
              "git_blob_sha": "28e703e38fe6628e29f75bf9881f8a56fad6bfdf"
            },
            {
              "platform": "gba",
              "field": "franchise",
              "source_path": "metadat/franchise/Nintendo - Game Boy Advance.dat",
              "git_blob_sha": "198ac98514bef220edaef9ca987d94b15b21d787"
            },
            {
              "platform": "nds",
              "field": "franchise",
              "source_path": "metadat/franchise/Nintendo - Nintendo DS.dat",
              "git_blob_sha": "16ffb7184fec15e46875c43b1741d0bd6ebb2fc8"
            },
            {
              "platform": "nes",
              "field": "serial",
              "source_path": "metadat/serial/Nintendo - Nintendo Entertainment System.dat",
              "git_blob_sha": "118e3d6e07f903ebedade4614e9fdea5be7146a2"
            },
            {
              "platform": "snes",
              "field": "serial",
              "source_path": "metadat/serial/Nintendo - Super Nintendo Entertainment System.dat",
              "git_blob_sha": "cb1a55f879a937e9c29911a1be90585117d78bd9"
            },
            {
              "platform": "gb",
              "field": "serial",
              "source_path": "metadat/serial/Nintendo - Game Boy.dat",
              "git_blob_sha": "12dc0141b8bc87a034e89ca807af821fa12dd041"
            },
            {
              "platform": "gbc",
              "field": "serial",
              "source_path": "metadat/serial/Nintendo - Game Boy Color.dat",
              "git_blob_sha": "2821379d213c54f77be10e5f3ff13decc1238276"
            },
            {
              "platform": "gba",
              "field": "serial",
              "source_path": "metadat/serial/Nintendo - Game Boy Advance.dat",
              "git_blob_sha": "7017c08dcf29ffb14670c59d4a005ce6104b6c40"
            },
            {
              "platform": "nes",
              "field": "users",
              "source_path": "metadat/maxusers/Nintendo - Nintendo Entertainment System.dat",
              "git_blob_sha": "b7577d5a2feaa2b86411e4cba84acd05fccd787b"
            },
            {
              "platform": "snes",
              "field": "users",
              "source_path": "metadat/maxusers/Nintendo - Super Nintendo Entertainment System.dat",
              "git_blob_sha": "1b3f22a5411d44f868b2fb16d778b29a48aa2901"
            },
            {
              "platform": "gb",
              "field": "users",
              "source_path": "metadat/maxusers/Nintendo - Game Boy.dat",
              "git_blob_sha": "70489ed215e64909bc0a423d139557e2f85fb0f0"
            },
            {
              "platform": "gbc",
              "field": "users",
              "source_path": "metadat/maxusers/Nintendo - Game Boy Color.dat",
              "git_blob_sha": "1874039e3878e30114c8b319fcce277231734980"
            },
            {
              "platform": "gba",
              "field": "users",
              "source_path": "metadat/maxusers/Nintendo - Game Boy Advance.dat",
              "git_blob_sha": "16b32a003c7c28a00f48cf62ac450c1494ca7943"
            },
            {
              "platform": "nes",
              "field": "esrb_rating",
              "source_path": "metadat/esrb/Nintendo - Nintendo Entertainment System.dat",
              "git_blob_sha": "d478aef5e5a22f0de67c508a680ad018ffd54578"
            },
            {
              "platform": "snes",
              "field": "esrb_rating",
              "source_path": "metadat/esrb/Nintendo - Super Nintendo Entertainment System.dat",
              "git_blob_sha": "92c79e6e703c9f145437d73b1a9cc54f4996115b"
            },
            {
              "platform": "gb",
              "field": "esrb_rating",
              "source_path": "metadat/esrb/Nintendo - Game Boy.dat",
              "git_blob_sha": "136a0aa49056590b4b1c3f65bb9a193555c0dae5"
            },
            {
              "platform": "gbc",
              "field": "esrb_rating",
              "source_path": "metadat/esrb/Nintendo - Game Boy Color.dat",
              "git_blob_sha": "a10a1a0c2786c17163a4a4acc05c49a29bf380b9"
            },
            {
              "platform": "gba",
              "field": "esrb_rating",
              "source_path": "metadat/esrb/Nintendo - Game Boy Advance.dat",
              "git_blob_sha": "da36e673e1dcb0da69afeccd337a353e08d2be9a"
            },
            {
              "platform": "gba",
              "field": "rumble",
              "source_path": "metadat/rumble/Nintendo - Game Boy Advance.dat",
              "git_blob_sha": "a1de2cd9080be9d00f8f3f99432bd93180a558d5"
            },
            {
              "platform": "gbc",
              "field": "rumble",
              "source_path": "metadat/rumble/Nintendo - Game Boy Color.dat",
              "git_blob_sha": "d12c4bd80b4377d61fe8baea4b93910d8fff6403"
            },
            {
              "platform": "nds",
              "field": "rumble",
              "source_path": "metadat/rumble/Nintendo - Nintendo DS.dat",
              "git_blob_sha": "da10ceb0cfee17574e88cb91cd98ada18203c1dd"
            }
          ]
          registry_path = Path("sources/libretro-enrichment.json")
          registry = json.loads(registry_path.read_text())
          assert registry["repository_revision"] == "fbeefcb46c2e1b20a7e2945f34a694a41b2d6f90"
          existing = {(x["platform"], x["field"]) for x in registry["files"]}
          for item in additions:
              assert (item["platform"], item["field"]) not in existing
          registry["files"].extend(additions)
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + "\n")
          print(f"Registered {len(additions)} additional pinned metadata DATs")
          PY
          python3 tools/fetch_pinned_sources.py
          python3 tools/import_enrichment.py --write
          python3 tools/audit_enrichment.py --write
          python3 tools/triage_enrichment.py --write
          python3 tools/build_distribution.py --write
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          
          register = json.loads(Path("sources/libretro-enrichment.json").read_text())
          audit = json.loads(Path("reports/enrichment-coverage-v1.json").read_text())
          total = audit["total_claims"]
          matched = audit["resolution_counts"]["matched"]
          readme = Path("README.md")
          old = readme.read_text()
          updated = re.sub(
              r"Twenty-nine pinned Libretro DATs supply \*\*[\d,]+ bibliographic claims\*\* across developer, publisher, release year, release month, and genre\.",
              f"{len(register['files'])} pinned Libretro DATs supply **{total:,} bibliographic claims** across developer, publisher, release-year, release-month, genre, franchise, serial, age-rating, player-count, and rumble fields.",
              old,
          )
          updated = re.sub(r"attaches \*\*[\d,]+ claims\*\*", f"attaches **{matched:,} claims**", updated)
          assert updated != old and f"**{total:,} bibliographic claims**" in updated and f"**{matched:,} claims**" in updated
          readme.write_text(updated)
          
          for name, before, after in [
              ("sources/README.md", "29 revision-pinned", "53 revision-pinned"),
              ("docs/PROVENANCE.md", "Twenty-nine additional", "53 additional"),
              ("docs/SOURCE-STRATEGY.md", "29 bibliographic DATs", "53 bibliographic DATs"),
              ("docs/ROADMAP.md", "29 developer, publisher, release-year, release-month, and genre metadata DATs",
               "53 pinned Libretro field-metadata DATs spanning developer, publisher, date, genre, franchise, serial, age rating, player count, and rumble"),
          ]:
              path = Path(name)
              text = path.read_text()
              if before not in text:
                  print(f"UNCHANGED {name}: editorial phrase not present")
                  continue
              path.write_text(text.replace(before, after))
          print(f"Updated documentation for {total:,} claims ({matched:,} matched)")
          PY
          python3 -m unittest discover -s tests -v
          python3 tools/import_enrichment.py --check
          python3 tools/audit_enrichment.py --check
          python3 tools/triage_enrichment.py --check
          python3 tools/build_distribution.py --check
          python3 tools/check_docs.py
          python3 tools/package_runtime.py --build /tmp/ludographium-runtime-expanded.tar.gz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/ archive/ generated/ reports/ README.md docs/
          git diff --cached --quiet && { echo 'No new source data'; exit 0; }
          git commit -m 'data: accession Libretro franchise, serial, age-rating, users and rumble claims'
          git push origin HEAD:main
