name: Accession sixth independently pinned CC0 console source wave

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/mame-softlists-v5.yml
      - sources/mame-softlists-v5.json
      - tools/acquire_mame_softlists.py
      - tools/index_mame_softlists.py

permissions:
  contents: write

concurrency:
  group: mame-softlists-v5-main
  cancel-in-progress: false

jobs:
  accession:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify 77 existing original MAME source partitions
        run: |
          set -euo pipefail
          for cohort in v1 v2 v3 v4; do
            python tools/acquire_mame_softlists.py --cohort "$cohort" --check
            python tools/index_mame_softlists.py --cohort "$cohort" --check
          done
      - name: Acquire and index six source-distinct XML collections, never game binaries
        run: |
          set -euo pipefail
          python tools/acquire_mame_softlists.py --cohort v5 --acquire
          python tools/acquire_mame_softlists.py --cohort v5 --check
          python tools/index_mame_softlists.py --cohort v5 --build
          python tools/index_mame_softlists.py --cohort v5 --check
          test "$(find data/mame/softlists-v5 -name manifest.json | wc -l)" -eq 6
          test "$(find data/mame/software-observations-v5 -name manifest.json | wc -l)" -eq 6
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          original=json.loads(Path("reports/mame-softlists-v5-summary.json").read_text())
          index=json.loads(Path("reports/mame-software-observations-v5-summary.json").read_text())
          assert original["software_list_partitions"] == 6
          assert index["indexed_source_partitions"] == 6
          assert original["source_register"] == index["source_register"] == "sources/mame-softlists-v5.json"
          total=original["source_observation_totals"]["source_software_entries"]
          assert total == index["source_observation_totals"]["software_entries"]
          assert total > 1152
          assert original["source_license"] == "CC0-1.0"
          assert original["source_observation_totals"]["source_rom_sha1_observations"] > 0
          assert original["source_observation_totals"]["source_disk_sha1_observations"] > 0
          assert {entry["source_list"] for entry in index["partitions"]} == {
              "3do_m2","cdi","cdtv","gamate","megacd","neogeo"
          }
          for item in index["partitions"]:
              xml=Path(item["original_xml_path"]).read_bytes()
              assert hashlib.sha256(xml).hexdigest() == item["original_xml_sha256"]
              assert Path(item["index_manifest"]).is_file()
          print(f"Verified {total} independently preserved fifth-cohort CC0 source records")
          PY
      - name: Commit original CC0 XML, manifests, and source-observation projections
        shell: bash
        run: |
          set -euo pipefail
          git add data/mame/softlists-v5 data/mame/software-observations-v5 reports/mame-softlists-v5-summary.json reports/mame-software-observations-v5-summary.json
          if git diff --cached --quiet; then
            echo "Already pinned fifth-cohort source records"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data(mame): preserve six original fifth-cohort CC0 console source lists'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo "Could not publish verified fifth-cohort original sources" >&2
          exit 1
