name: Validate metadata
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Parser and lookup tests
        run: python -m unittest discover -s tests -v
      - name: Validate pinned sources and generated indexes
        run: python tools/verify_catalog.py
      - name: Rebuild-check identification catalog
        run: python tools/rebuild_catalog.py --check
      - name: Verify SHA-256 distribution manifest
        run: python tools/build_distribution.py --check
      - name: Verify source field coverage report
        run: python tools/audit_catalog.py --check
      - name: Validate pinned bibliographic claims
        run: python tools/import_enrichment.py --check
      - name: Verify enrichment coverage report
        run: python tools/audit_enrichment.py --check
      - name: Prepare unresolved-source reconciliation queue
        run: |
          python tools/triage_enrichment.py --write
          echo BEGIN-LDG-RECONCILIATION-QUEUE
          cat reports/reconciliation-queue-v1.json
          echo END-LDG-RECONCILIATION-QUEUE
      - name: Validate curated identity ledger
        run: python tools/validate_curated.py
      - name: Verify enriched fingerprint lookup
        run: |
          python tools/lookup_enrichment.py --platform gba --sha1 FC6163F99B71B05C10686A0D29010B31274E1DC4 > /tmp/ludographium-enriched.json
          python -c 'import json; d=json.load(open("/tmp/ludographium-enriched.json")); assert d["match_count"] == 1; assert "developer" in {c["field"] for c in d["matches"][0]["metadata_claims"]}'
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Build and test Rust client
        run: cargo test --workspace --all-targets --locked
      - name: Verify Rust CLI offline lookup
        run: |
          cargo run --locked --quiet -p ludographium -- --platform gb --sha1 952D154DD2C6189EF4B786AE37BD7887C8CA9037 > /tmp/ludographium.json
          python -c 'import json; d=json.load(open("/tmp/ludographium.json")); assert d["match_count"] == 1; assert d["matches"][0]["title"] == "10-Pin Bowling (USA) (Proto)"'
          cargo run --locked --quiet -p ludographium -- --enriched --platform gba --sha1 FC6163F99B71B05C10686A0D29010B31274E1DC4 > /tmp/ludographium-rust-enriched.json
          python -c 'import json; d=json.load(open("/tmp/ludographium-rust-enriched.json")); assert d["match_count"] == 1; assert "developer" in {c["field"] for c in d["matches"][0]["metadata_claims"]}'
      - name: Verify bounded title discovery with and without enrichment
        run: |
          cargo run --locked --quiet -p ludographium -- --platform nes --title Mario --limit 5 > /tmp/ldg-title.json
          cargo run --locked --quiet -p ludographium -- --platform nes --title Mario --limit 5 --enriched > /tmp/ldg-enriched-title.json
          python - <<'PY'
          import json
          for filename in ("/tmp/ldg-title.json", "/tmp/ldg-enriched-title.json"):
              d = json.load(open(filename))
              assert d["query_kind"] == "source-title-substring"
              assert d["total_source_records"] >= len(d["matches"]) > 0
              assert all("mario" in match["title"].lower() for match in d["matches"])
          PY
      - name: Smoke-test NES and DS fingerprint matching
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          for platform in ("nes", "nds"):
              bundle = json.loads(Path(f"generated/v1/{platform}.json").read_text())
              hash_value = bundle["records"][0]["roms"][0]["sha1"]
              for enriched in (False, True):
                  cmd = ["cargo", "run", "--locked", "--quiet", "-p", "ludographium",
                         "--", "--platform", platform, "--sha1", hash_value]
                  if enriched:
                      cmd.append("--enriched")
                  result = json.loads(subprocess.check_output(cmd, text=True))
                  assert result["match_count"] >= 1
                  assert result["matches"][0]["platform"] == platform
                  if enriched:
                      assert "metadata_claims" in result["matches"][0]
          PY
