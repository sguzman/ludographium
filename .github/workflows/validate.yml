name: Validate metadata
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Parser and lookup tests
        run: python -m unittest discover -s tests -v
      - name: Validate pinned sources and generated indexes
        run: python tools/verify_catalog.py
