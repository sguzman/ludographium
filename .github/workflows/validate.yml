name: Validate metadata
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Parser and lookup tests
        run: python -m unittest discover -s tests -v
      - name: Validate pinned sources and generated indexes
        run: python tools/verify_catalog.py
      - name: Rebuild-check identification catalog
        run: python tools/rebuild_catalog.py --check
      - name: Verify curated identity export
        run: python tools/build_curated.py --check
      - name: Verify SHA-256 distribution manifest
        run: python tools/build_distribution.py --check
      - name: Validate Markdown and advertised catalog counts
        run: python tools/check_docs.py
      - name: Build and verify portable runtime package
        run: |
          python tools/package_runtime.py --build /tmp/ludographium-runtime-v1.tar.gz
          python tools/package_runtime.py --verify /tmp/ludographium-runtime-v1.tar.gz
      - name: Publish portable runtime package
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ludographium-runtime-v1
          path: /tmp/ludographium-runtime-v1.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Verify source field coverage report
        run: python tools/audit_catalog.py --check
      - name: Validate pinned bibliographic claims
        run: python tools/import_enrichment.py --check
      - name: Verify enrichment coverage report
        run: python tools/audit_enrichment.py --check
      - name: Verify provenance-linked reconciliation queue
        run: python tools/triage_enrichment.py --check
      - name: Validate curated identity ledger
        run: python tools/validate_curated.py
      - name: Verify Python title search and enriched claims
        run: |
          python tools/lookup.py --platform nes --title Mario --limit 5 > /tmp/ludographium-python-title.json
          python tools/lookup_enrichment.py --platform nes --title Mario --limit 5 > /tmp/ludographium-python-enriched-title.json
          python - <<'PY'
          import json
          for name in ("/tmp/ludographium-python-title.json", "/tmp/ludographium-python-enriched-title.json"):
              value = json.load(open(name))
              assert value["query_kind"] == "source-title-substring"
              assert value["total_source_records"] >= len(value["matches"]) > 0
              assert all("mario" in hit["title"].lower() for hit in value["matches"])
          PY
      - name: Verify enriched fingerprint lookup
        run: |
          python tools/lookup_enrichment.py --platform gba --sha1 FC6163F99B71B05C10686A0D29010B31274E1DC4 > /tmp/ludographium-enriched.json
          python -c 'import json; d=json.load(open("/tmp/ludographium-enriched.json")); assert d["match_count"] == 1; assert "developer" in {c["field"] for c in d["matches"][0]["metadata_claims"]}'
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture formatted multi-platform library
        run: |
          cargo fmt --all
          echo BEGIN-LDG-COLLECTION-RS
          base64 -w0 crates/ludographium/src/collection.rs
          echo
          echo END-LDG-COLLECTION-RS
          echo BEGIN-LDG-COLLECTION-MAIN
          base64 -w0 crates/ludographium/src/main.rs
          echo
          echo END-LDG-COLLECTION-MAIN
      - name: Build and test Rust client
        run: cargo test --workspace --all-targets --locked
      - name: Verify Rust CLI offline lookup
        run: |
          cargo run --locked --quiet -p ludographium -- --platform gb --sha1 952D154DD2C6189EF4B786AE37BD7887C8CA9037 > /tmp/ludographium.json
          python -c 'import json; d=json.load(open("/tmp/ludographium.json")); assert d["match_count"] == 1; assert d["matches"][0]["title"] == "10-Pin Bowling (USA) (Proto)"'
          cargo run --locked --quiet -p ludographium -- --enriched --platform gba --sha1 FC6163F99B71B05C10686A0D29010B31274E1DC4 > /tmp/ludographium-rust-enriched.json
          python -c 'import json; d=json.load(open("/tmp/ludographium-rust-enriched.json")); assert d["match_count"] == 1; assert "developer" in {c["field"] for c in d["matches"][0]["metadata_claims"]}'
      - name: Verify curated identity lookup from exact media source
        run: |
          cargo run --locked --quiet -p ludographium -- --platform snes --curated --sha1 6B47BB75D16514B6A476AA0C73A683A2A4C18765 > /tmp/ldg-curated.json
          cargo run --locked --quiet -p ludographium -- --platform snes --curated --enriched --sha1 6B47BB75D16514B6A476AA0C73A683A2A4C18765 > /tmp/ldg-curated-enriched.json
          python - <<'PY'
          import json
          for path in ("/tmp/ldg-curated.json", "/tmp/ldg-curated-enriched.json"):
              result = json.load(open(path))
              assert result["match_count"] == 1
              entry = result["matches"][0]["curated_identities"]
              assert len(entry) == 1
              assert entry[0]["work"]["preferred_title"] == "Super Mario World"
              assert entry[0]["release"]["platform"] == "snes"
              assert entry[0]["build"]["media"]["sha1"] == "6B47BB75D16514B6A476AA0C73A683A2A4C18765"
          PY
      - name: Verify raw-file SHA-1 streaming without retaining media
        run: |
          printf 'synthetic fixture, not a game ROM' > /tmp/ludographium-synthetic.bin
          cargo run --locked --quiet -p ludographium -- --platform gg --file /tmp/ludographium-synthetic.bin > /tmp/ldg-file.json
          cargo run --locked --quiet -p ludographium -- --enriched --platform gg --file /tmp/ludographium-synthetic.bin > /tmp/ldg-enriched-file.json
          python - <<'PY'
          import json
          for filename in ("/tmp/ldg-file.json", "/tmp/ldg-enriched-file.json"):
              data = json.load(open(filename))
              assert data["input_kind"] == "exact-local-file-bytes"
              assert data["match_count"] == 0
              assert data["matches"] == []
          PY
      - name: Verify bounded title discovery with and without enrichment
        run: |
          cargo run --locked --quiet -p ludographium -- --platform nes --title Mario --limit 5 > /tmp/ldg-title.json
          cargo run --locked --quiet -p ludographium -- --platform nes --title Mario --limit 5 --enriched > /tmp/ldg-enriched-title.json
          python - <<'PY'
          import json
          for filename in ("/tmp/ldg-title.json", "/tmp/ldg-enriched-title.json"):
              d = json.load(open(filename))
              assert d["query_kind"] == "source-title-substring"
              assert d["total_source_records"] >= len(d["matches"]) > 0
              assert all("mario" in match["title"].lower() for match in d["matches"])
          PY
      - name: Verify cross-platform discovery and exact-media attribution
        run: |
          cargo run --locked --quiet -p ludographium -- --platform all --sha1 6B47BB75D16514B6A476AA0C73A683A2A4C18765 --curated > /tmp/ldg-all-curated.json
          cargo run --locked --quiet -p ludographium -- --platform all --title "Mario" --limit 3 --enriched > /tmp/ldg-all-title.json
          printf 'synthetic test fixture, not game content' > /tmp/ldg-all-synthetic.bin
          cargo run --locked --quiet -p ludographium -- --platform all --file /tmp/ldg-all-synthetic.bin > /tmp/ldg-all-file.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("generated/v1/catalog.json").read_text())
          p = [x["platform"] for x in manifest["platforms"]]
          work = json.loads(Path("/tmp/ldg-all-curated.json").read_text())
          assert work["platforms_searched"] == p
          assert work["match_count"] >= 1
          assert any(m["platform"] == "snes" and m["curated_identities"][0]["work"]["preferred_title"] == "Super Mario World" for m in work["matches"])
          titles = json.loads(Path("/tmp/ldg-all-title.json").read_text())
          assert titles["platforms_searched"] == p
          assert titles["query_kind"] == "source-title-substring"
          assert titles["total_source_records"] >= 3
          assert len(titles["matches"]) <= 3
          assert all("mario" in m["title"].lower() for m in titles["matches"])
          assert len(titles["enrichment_sources"]) == len(p)
          file = json.loads(Path("/tmp/ldg-all-file.json").read_text())
          assert file["match_count"] == 0
          assert file["input_kind"] == "exact-local-file-bytes"
          PY
      - name: Smoke-test all accessioned platform fingerprints
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          manifest = json.loads(Path("generated/v1/catalog.json").read_text())
          for item in manifest["platforms"]:
              platform = item["platform"]
              bundle = json.loads(Path(item["artifact_path"]).read_text())
              hash_value = bundle["records"][0]["roms"][0]["sha1"]
              for enriched in (False, True):
                  cmd = ["cargo", "run", "--locked", "--quiet", "-p", "ludographium",
                         "--", "--platform", platform, "--sha1", hash_value]
                  if enriched:
                      cmd.append("--enriched")
                  result = json.loads(subprocess.check_output(cmd, text=True))
                  assert result["match_count"] >= 1
                  assert result["matches"][0]["platform"] == platform
                  if enriched:
                      assert "metadata_claims" in result["matches"][0]
          PY
