name: Accession GameFAQs platform-qualified identifier statements

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/wikidata-gamefaqs-qualifiers.yml

permissions:
  contents: write

concurrency:
  group: wikidata-gamefaqs-statement-qualifiers-main
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Preserve original P4769 statement IDs and optional platform qualifiers
        shell: bash
        run: |
          set -euo pipefail
          base=data/wikidata/gamefaqs-qualifiers-v1
          while read -r platform qid; do
            out="$base/$platform"
            if test -f "$out/manifest.json"; then
              test "$(jq -r '.wikidata_platform' "$out/manifest.json")" = "$qid"
              for name in query.rq response.json bindings.jsonl; do
                key="$(case "$name" in query.rq) echo query ;; response.json) echo response ;; *) echo bindings ;; esac)"
                test "$(sha256sum "$out/$name" | cut -d' ' -f1)" = "$(jq -r --arg key "$key" '.["source_" + $key + "_sha256"]' "$out/manifest.json")"
              done
              echo "Preserved exact $platform source snapshot"
              continue
            fi
            mkdir -p "$out"
            cat > "$out/query.rq" <<EOF
          SELECT DISTINCT ?item ?statement ?identifier ?qualifiedPlatform WHERE {
            ?item wdt:P31 wd:Q7889; wdt:P400 wd:$qid.
            ?item p:P4769 ?statement.
            ?statement ps:P4769 ?identifier.
            OPTIONAL { ?statement pq:P400 ?qualifiedPlatform. }
          }
          ORDER BY ?item ?statement ?identifier ?qualifiedPlatform
          LIMIT 30000
          EOF
            curl --fail --location --get --retry 5 --retry-all-errors \
              --retry-delay 6 --max-time 95 --silent --show-error \
              -H 'User-Agent: Ludographium/1.0 (https://github.com/sguzman/ludographium; CC0 metadata research)' \
              -H 'Accept: application/sparql-results+json' \
              --data-urlencode 'format=json' \
              --data-urlencode "query@$out/query.rq" \
              'https://query.wikidata.org/sparql' \
              -o "$out/response.json"
            jq -r --arg platform "$platform" '"\($platform) statement rows=\(.results.bindings | length)"' "$out/response.json"
            jq -e '
              .head.vars == ["item","statement","identifier","qualifiedPlatform"]
              and (.results.bindings | type == "array" and length > 0 and length < 30000)
              and all(.results.bindings[];
                .item.type == "uri"
                and (.item.value | test("^https?://www[.]wikidata[.]org/entity/Q[1-9][0-9]*$"))
                and .statement.type == "uri"
                and (.statement.value | test("^https?://www[.]wikidata[.]org/entity/statement/Q[1-9][0-9]*[-].+$"))
                and (.identifier.type | IN("literal","typed-literal"))
                and (.identifier.value | type == "string" and length > 0)
                and ((has("qualifiedPlatform") | not)
                    or (.qualifiedPlatform.type == "uri"
                        and (.qualifiedPlatform.value | test("^https?://www[.]wikidata[.]org/entity/Q[1-9][0-9]*$")))))
            ' "$out/response.json" > /dev/null
            test "$(wc -c < "$out/response.json")" -lt 20000000
            jq -cS '.results.bindings[]' "$out/response.json" > "$out/bindings.jsonl"
            count="$(wc -l < "$out/bindings.jsonl")"
            statements="$(jq -r '.results.bindings[].statement.value' "$out/response.json" | LC_ALL=C sort -u | wc -l)"
            qualified="$(jq '[.results.bindings[] | select(has("qualifiedPlatform"))] | length' "$out/response.json")"
            jq -n --arg platform "$platform" --arg platform_qid "$qid" \
              --arg captured_at_utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg query_sha "$(sha256sum "$out/query.rq" | cut -d' ' -f1)" \
              --arg response_sha "$(sha256sum "$out/response.json" | cut -d' ' -f1)" \
              --arg bindings_sha "$(sha256sum "$out/bindings.jsonl" | cut -d' ' -f1)" \
              --argjson query_bytes "$(wc -c < "$out/query.rq")" \
              --argjson response_bytes "$(wc -c < "$out/response.json")" \
              --argjson bindings_bytes "$(wc -c < "$out/bindings.jsonl")" \
              --argjson count "$count" --argjson statements "$statements" \
              --argjson qualified "$qualified" \
              '{
                schema_version: 1,
                source: "Wikidata",
                license: "CC0-1.0",
                platform: $platform,
                wikidata_platform: $platform_qid,
                source_revision: "live-query-capture",
                captured_at_utc: $captured_at_utc,
                property: "P4769",
                optional_qualifier: "P400",
                source_query_path: "query.rq",
                source_query_sha256: $query_sha,
                source_query_bytes: $query_bytes,
                source_response_path: "response.json",
                source_response_sha256: $response_sha,
                source_response_bytes: $response_bytes,
                source_bindings_path: "bindings.jsonl",
                source_bindings_sha256: $bindings_sha,
                source_bindings_bytes: $bindings_bytes,
                source_rows: $count,
                distinct_source_statements: $statements,
                rows_with_explicit_platform_qualifier: $qualified,
                query_limit: 30000,
                identity_policy: "Preserve individual Wikidata P4769 statement and optional P400 qualifier; missing qualifier remains missing; no external GameFAQs validation or canonical game identities"
              }' > "$out/manifest.json"
            jq -e '.source_rows > 0 and .distinct_source_statements > 0 and .source_rows < .query_limit' "$out/manifest.json" > /dev/null
            echo "$platform: $count source statement rows; $qualified explicit platform qualifiers"
            sleep 2
          done < <(jq -r '.platforms[] | "\(.platform) \(.wikidata_platform)"' sources/wikidata-v1.json)
          test "$(find "$base" -name manifest.json | wc -l)" -eq 16
      - name: Commit only complete text source captures
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          if git ls-files | grep -Ei '\.(sqlite|sqlite3|db|mdb)$'; then
            echo "Refusing generated binary database files"
            exit 1
          fi
          git add data/wikidata/gamefaqs-qualifiers-v1
          if git diff --cached --quiet; then
            echo "Already pinned"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data(wikidata): pin original GameFAQs platform-qualified source statements'
          git push origin HEAD:main
