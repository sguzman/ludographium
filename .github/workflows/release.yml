name: Publish versioned metadata
on:
  push:
    branches:
      - main
    tags:
      - 'data-v*'
    # Path filters are not evaluated for tag pushes. On main, a publication
    # requires a deliberate change to this exact request file.
    paths:
      - '.github/data-release.json'

permissions:
  contents: read

concurrency:
  group: ludographium-data-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      mode: ${{ steps.release.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve and validate versioned release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
            RELEASE_MODE='tag'
            [[ "$RELEASE_TAG" =~ ^data-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
              echo 'Expected data-vMAJOR.MINOR.PATCH without leading zeroes or suffixes'
              exit 1
            }
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo 'Release tag must point to a commit on main history'
              exit 1
            }
          elif [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
            RELEASE_TAG="$(python tools/release_request.py --file .github/data-release.json)"
            RELEASE_MODE='request'
            [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || {
              echo 'Refusing a release from a mismatched checkout'
              exit 1
            }
          else
            echo 'Only main release requests or data tags may publish'
            exit 1
          fi
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'mode=%s\n' "$RELEASE_MODE" >> "$GITHUB_OUTPUT"
      - name: Test and verify metadata, attribution, and documentation
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python tools/verify_catalog.py
          python tools/rebuild_catalog.py --check
          python tools/build_curated.py --check
          python tools/build_distribution.py --check
          python tools/check_docs.py
          python tools/audit_catalog.py --check
          python tools/import_enrichment.py --check
          python tools/audit_enrichment.py --check
          python tools/triage_enrichment.py --check
          python tools/validate_curated.py
          python tools/triage_identities.py --verify
          python tools/audit_curated_claims.py --verify
          python tools/prioritize_identity_review.py --verify
          python tools/build_corpus.py --build --db "$RUNNER_TEMP/validated-corpus.sqlite"
          python tools/build_corpus.py --verify --db "$RUNNER_TEMP/validated-corpus.sqlite"
      - name: Validate Rust offline reader
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          python tools/smoke_media_formats.py
          python tools/smoke_runtime.py
          python tools/smoke_curated_revisions.py
      - name: Rebuild and attribute complete 75-platform expanded corpus
        run: |
          set -euo pipefail
          python tools/build_expanded_corpus.py --build --db "$RUNNER_TEMP/expanded-base.sqlite"
          python tools/enrich_expanded_corpus.py --build --from-db "$RUNNER_TEMP/expanded-base.sqlite" --db "$RUNNER_TEMP/expanded-complete.sqlite"
          python tools/enrich_expanded_corpus.py --verify --db "$RUNNER_TEMP/expanded-complete.sqlite"
          python - "$RUNNER_TEMP/expanded-complete.sqlite" <<'PY'
          import sqlite3
          import sys
          db = sqlite3.connect(sys.argv[1])
          actual = [db.execute(f"SELECT COUNT(*) FROM {table}").fetchone()[0]
                    for table in ("platforms", "games", "media", "claims", "source_archives", "field_archives")]
          assert actual == [75, 117145, 117145, 167640, 65, 279], actual
          assert db.execute("SELECT COUNT(*) FROM claims WHERE resolution_status='matched'").fetchone()[0] == 112948
          assert db.execute("SELECT COUNT(*) FROM claims WHERE crc32 IS NULL AND resolution_status='missing_crc'").fetchone()[0] > 0
          print("PASS: expanded accession exactly matches validated 75-system coverage")
          PY
      - name: Stage and verify portable release
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          python tools/prepare_release.py --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/release"
          cp "$RUNNER_TEMP/validated-corpus.sqlite" "$RUNNER_TEMP/release/ludographium-corpus-${RELEASE_TAG}.sqlite"
          cp "$RUNNER_TEMP/expanded-complete.sqlite" "$RUNNER_TEMP/release/ludographium-expanded-${RELEASE_TAG}.sqlite"
          python tools/build_corpus.py --verify --db "$RUNNER_TEMP/release/ludographium-corpus-${RELEASE_TAG}.sqlite"
          cd "$RUNNER_TEMP/release"
          sha256sum "ludographium-corpus-${RELEASE_TAG}.sqlite" > "ludographium-corpus-${RELEASE_TAG}.sqlite.sha256"
          sha256sum --check "ludographium-corpus-${RELEASE_TAG}.sqlite.sha256"
          sha256sum "ludographium-expanded-${RELEASE_TAG}.sqlite" > "ludographium-expanded-${RELEASE_TAG}.sqlite.sha256"
          sha256sum --check "ludographium-expanded-${RELEASE_TAG}.sqlite.sha256"
          sha256sum --check "ludographium-runtime-${RELEASE_TAG}.tar.gz.sha256"
          python "$GITHUB_WORKSPACE/tools/package_runtime.py" --root "$GITHUB_WORKSPACE" \
            --verify "$RUNNER_TEMP/release/ludographium-runtime-${RELEASE_TAG}.tar.gz"
          cat >> "$RUNNER_TEMP/release/RELEASE_NOTES.md" <<'EOF'

### Expanded console-game metadata accession

The separately released expanded SQLite database includes **117,145 original source observations
across 75 console and handheld platform collections**, and **167,640 bibliographic source claims**
(112,948 exact-source-attached claims). These are **source observations, not a count of unique games**.

Additional coverage comes from 65 individually hash-pinned No-Intro identification DATs and 279
pinned field-metadata DATs. Their original bytes, provenance, source revisions and source paths
are stored in the expanded SQLite file. Ambiguous and checksum-free source claims remain
unresolved rather than being silently attached to game identities. No ROMs or executables
are included. All source-specific reuse and attribution notices continue to apply.
EOF
      - name: Transfer verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: validated-data-release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: validated-data-release
          path: ${{ runner.temp }}/release
      - name: Verify transferred checksum and publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_MODE: ${{ needs.validate.outputs.mode }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          sha256sum --check "ludographium-runtime-${RELEASE_TAG}.tar.gz.sha256"
          sha256sum --check "ludographium-corpus-${RELEASE_TAG}.sqlite.sha256"
          sha256sum --check "ludographium-expanded-${RELEASE_TAG}.sqlite.sha256"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists; refusing to overwrite assets"
            exit 1
          fi
          if [[ "$RELEASE_MODE" == 'request' ]]; then
            # A request creates a new tag at the fully validated main commit.
            # Never move or reuse a tag from a previous release.
            if gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              echo "Tag $RELEASE_TAG exists; refusing to reuse it"
              exit 1
            fi
            gh release create "$RELEASE_TAG" \
              "ludographium-runtime-${RELEASE_TAG}.tar.gz" \
              "ludographium-runtime-${RELEASE_TAG}.tar.gz.sha256" \
              "ludographium-corpus-${RELEASE_TAG}.sqlite" \
              "ludographium-corpus-${RELEASE_TAG}.sqlite.sha256" \
              "ludographium-expanded-${RELEASE_TAG}.sqlite" \
              "ludographium-expanded-${RELEASE_TAG}.sqlite.sha256" \
              --target "$GITHUB_SHA" --latest=false \
              --title "Ludographium metadata ${RELEASE_TAG}" \
              --notes-file RELEASE_NOTES.md
          elif [[ "$RELEASE_MODE" == 'tag' ]]; then
            gh release create "$RELEASE_TAG" \
              "ludographium-runtime-${RELEASE_TAG}.tar.gz" \
              "ludographium-runtime-${RELEASE_TAG}.tar.gz.sha256" \
              "ludographium-corpus-${RELEASE_TAG}.sqlite" \
              "ludographium-corpus-${RELEASE_TAG}.sqlite.sha256" \
              "ludographium-expanded-${RELEASE_TAG}.sqlite" \
              "ludographium-expanded-${RELEASE_TAG}.sqlite.sha256" \
              --verify-tag --latest=false \
              --title "Ludographium metadata ${RELEASE_TAG}" \
              --notes-file RELEASE_NOTES.md
          else
            echo 'Invalid release mode'
            exit 1
          fi
