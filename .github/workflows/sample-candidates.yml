name: Temporary curated source sampling
on:
  push:
    paths:
      - '.github/workflows/sample-candidates.yml'
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Identify real source records for curated entries
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          targets = {
              "snes": "Super Mario World",
              "genesis": "Sonic The Hedgehog",
              "gba": "Metroid Fusion",
              "n64": "Super Mario 64",
          }
          for platform, needle in targets.items():
              records = json.loads(Path(f"generated/v1/{platform}.json").read_text())["records"]
              hits = [r for r in records if needle.casefold() in r["name"].casefold()]
              shortlist = sorted(hits, key=lambda r: (
                  0 if r["name"].endswith("(USA)") else 1,
                  "(Rev " in r["name"],
                  "(Beta" in r["name"] or "(Proto" in r["name"],
                  len(r["name"]),
              ))[:10]
              print("BEGIN-LDG-CURATION-CANDIDATES " + platform)
              for r in shortlist:
                  print(json.dumps({"ordinal": r["source_ordinal"], "name": r["name"],
                                    "roms": r["roms"]}, ensure_ascii=False))
              print("END-LDG-CURATION-CANDIDATES " + platform)
          PY
