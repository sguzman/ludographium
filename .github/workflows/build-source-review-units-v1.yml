name: Publish stable-ID original-source evidence review units

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-source-review-units-v1.yml
      - tools/build_source_review_units.py

permissions:
  contents: write

concurrency:
  group: build-source-review-units-v1-main
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify separate original SHA-1 and title-review evidence families
        run: |
          python tools/reconcile_mame_media.py --check
          python tools/reconcile_mame_titles.py --check
          python -m unittest discover -s tests -p test_source_review_units.py -v
      - name: Produce stable original-source-only review work queue
        run: |
          python tools/build_source_review_units.py --write
          python tools/build_source_review_units.py --check
          python -m unittest discover -s tests -p test_query_source_review_units.py -v
          python tools/query_source_review_units.py --ambiguous-only --limit 1 > /tmp/ludographium-ambiguous-source-review.json
          python tools/query_source_review_units.py --evidence-type title --limit 1 > /tmp/ludographium-title-source-review.json
      - name: Commit only review IDs and provenance-linked source ordinals
        shell: bash
        run: |
          set -euo pipefail
          git add data/reconciliation/source-review-units-v1/units.jsonl reports/source-review-units-v1-summary.json
          if git diff --cached --quiet; then
            echo "Stable original-source review work queue already verified"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'reports: pin stable original-source review units with source ambiguity'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo 'Failed to pin verified evidence review units' >&2
          exit 1
