name: Pin exploratory Wikidata platform entity search responses

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/wikidata-platform-discovery-v1.yml
      - tools/discover_wikidata_platforms.py
      - sources/wikidata-platform-discovery-v1.json

permissions:
  contents: write

concurrency:
  group: wikidata-platform-discovery-v1-main
  cancel-in-progress: false

jobs:
  accession:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Capture all unregistered scope QID search leads
        run: |
          python tools/audit_wikidata_platform_gaps.py --check
          python tools/discover_wikidata_platforms.py --acquire
          python tools/discover_wikidata_platforms.py --check
          test "$(find data/wikidata/platform-discovery-v1 -name manifest.json | wc -l)" -eq 14
      - name: Preserve independently sourced discovery evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git add data/wikidata/platform-discovery-v1
          if git diff --cached --quiet; then
            echo "Existing discovery snapshots verified"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data(wikidata): pin 14 unverified platform entity search captures'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo "Failed to publish scoped entity-search source evidence" >&2
          exit 1
